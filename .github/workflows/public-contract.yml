name: Public independent CSV contract checks
on:
  push:
    branches: [main]
    paths:
      - 'verify_csv.py'
      - 'tests/**'
      - '.github/workflows/public-contract.yml'
  pull_request:
    paths:
      - 'verify_csv.py'
      - 'tests/**'
      - '.github/workflows/public-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent synthetic reference tests
        run: python -m unittest discover -s tests -v
